[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atdrive"
version = "7.0.0"
description = "ATDrive: IRT-based adaptive testing for closed-loop driving evaluation"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

# Pinned, not lower-bounded. The reported numbers are float32 optimisation
# results; sklearn's k-means seeding and Ridge solver dispatch, and torch's
# reduction kernels, all move them in the third decimal across versions.
# See REPRODUCIBILITY.md.
dependencies = [
    "numpy==1.23.4",
    "scipy==1.13.1",
    "scikit-learn==1.2.2",
    "torch==2.0.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]
figs = ["matplotlib"]

[tool.setuptools]
packages = ["atdrive"]

[tool.pytest.ini_options]
testpaths = ["tests"]

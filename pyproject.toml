[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scirt"
version = "1.0.0"
description = "Scene-conditioned item response theory for driving-policy evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

# Pinned, not lower-bounded. The reported numbers are float32 optimisation
# results; sklearn's k-means seeding and Ridge solver dispatch, and torch's
# reduction kernels, all move them in the third decimal across versions.
# See REPRODUCIBILITY.md for the stability tiers.
dependencies = [
    "numpy==2.4.6",
    "scipy==1.18.0",
    "scikit-learn==1.9.0",
    "torch==2.12.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["scirt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
